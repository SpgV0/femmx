<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The short line, and dashed the distance it grows to reach the
       boundary on the right. -->
  <line x1="2" y1="16" x2="11" y2="16" stroke="CURRENTCOLOR" stroke-width="2"/>
  <line x1="11" y1="16" x2="19" y2="16" stroke="CURRENTCOLOR" stroke-width="2" stroke-dasharray="2 2" opacity="0.45"/>
  <polygon points="19,16 15,13.5 15,18.5" fill="CURRENTCOLOR" opacity="0.45"/>
  <!-- What it extends to. -->
  <line x1="21" y1="3" x2="21" y2="21" stroke="CURRENTCOLOR" stroke-width="2"/>
</svg>
