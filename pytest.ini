; Added by Claude (Anthropic), noreply@anthropic.com, 2026-09-12 (issue
; #22). Before this there was no pytest configuration file at all: rootdir
; was inferred, and nothing bounded how long a test could take.
;
; The timeouts matter here more than they would in most suites. Every test
; drives a real femmx.exe over COM, and this fork's recurring defect is a
; modal dialog on a code path nobody expected to be interactive -- the
; solvers' argc rule, savebitmap, --render-png, the installer's .onInit
; upgrade prompt. Each one manifests the same way: the call never returns,
; and with no timeout the job sits there until the runner's own global
; limit kills it, with no indication of which test was to blame.

[pytest]
testpaths = test

; Per test. The whole suite is ~130s and the slowest single module is
; ~16s, so this cannot be reached by a test that is merely slow -- only by
; one that is stuck. thread, not signal: signal-based timeouts need
; SIGALRM, which Windows does not have, and the thread method can
; interrupt a test blocked inside a COM call, which is exactly the case
; this is for.
timeout = 300
timeout_method = thread

; For the whole run, so a pathological combination (several tests each
; sitting just under the per-test limit) still cannot run away. Generous
; against the measured ~130s because the full lane also builds models and
; installs an installer.
session_timeout = 2400

; Show the slowest handful at the end of every run: performance drift in
; this suite has historically been noticed by accident, if at all.
addopts = --durations=10 -ra
